<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SCARPA RAG Agent Architecture Diagram</title>
  <desc>A flowchart showing the six-step RAG agent pipeline: user prompt, input guardrail, classifier, six vector database searches, output guardrail, and delivery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- START -->
  <g>
    <rect x="270" y="20" width="140" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="40" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">User prompt</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="60" x2="340" y2="90" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GUARDRAIL 1 -->
  <g>
    <rect x="230" y="90" width="220" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Input guardrail</text>
    <text x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">PII · jailbreak · prompt injection</text>
  </g>

  <!-- Fail branch -->
  <line x1="450" y1="116" x2="530" y2="116" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="530" y="98" width="100" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="580" y="116" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Blocked</text>
  </g>
  <text x="490" y="108" text-anchor="middle" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fail</text>

  <!-- Pass arrow down -->
  <line x1="340" y1="142" x2="340" y2="172" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="160" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Pass</text>

  <!-- CLASSIFIER -->
  <g>
    <rect x="210" y="172" width="260" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Classifier</text>
    <text x="340" y="210" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Routes to product category</text>
  </g>

  <!-- Arrow down to DB row -->
  <line x1="340" y1="224" x2="340" y2="254" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB TIER — 6 boxes -->
  <!-- Trail Running -->
  <g>
    <rect x="20" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="67" y="272" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Trail</text>
    <text x="67" y="292" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Running</text>
  </g>
  <!-- Approach -->
  <g>
    <rect x="127" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="174" y="280" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Approach</text>
  </g>
  <!-- Climbing -->
  <g>
    <rect x="234" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="281" y="280" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Climbing</text>
  </g>
  <!-- Mountaineering -->
  <g>
    <rect x="341" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="388" y="272" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Mountain-</text>
    <text x="388" y="290" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">eering</text>
  </g>
  <!-- Skiing -->
  <g>
    <rect x="448" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="495" y="280" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Skiing</text>
  </g>
  <!-- Lifestyle -->
  <g>
    <rect x="555" y="254" width="95" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="602" y="280" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Lifestyle</text>
  </g>

  <!-- Fan lines from classifier to each DB -->
  <path d="M340 254 L340 244 L67 244 L67 254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M340 254 L340 244 L174 244 L174 254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M281 254 L281 244 L281 254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="244" x2="281" y2="254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="244" x2="388" y2="254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M340 254 L340 244 L495 244 L495 254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M340 254 L340 244 L602 244 L602 254" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Converge lines from DBs to a point -->
  <path d="M67 306 L67 370 L340 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <path d="M174 306 L174 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <path d="M281 306 L281 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <path d="M388 306 L388 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <path d="M495 306 L495 370 L340 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <path d="M602 306 L602 370 L340 370" fill="none" stroke="rgba(31, 30, 29, 0.3)" stroke-width="0.5"/>
  <line x1="340" y1="370" x2="340" y2="400" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB label -->
  <text x="340" y="344" text-anchor="middle" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Vector database search</text>

  <!-- GUARDRAIL 2 -->
  <g>
    <rect x="230" y="400" width="220" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="418" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Output guardrail</text>
    <text x="340" y="438" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Hallucination / faithfulness check</text>
  </g>

  <!-- Fail branch right -->
  <line x1="450" y1="426" x2="530" y2="426" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="530" y="408" width="120" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="590" y="426" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Response withheld</text>
  </g>
  <text x="490" y="418" text-anchor="middle" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fail</text>

  <!-- Pass arrow down -->
  <line x1="340" y1="452" x2="340" y2="482" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="470" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Pass</text>

  <!-- DELIVERY -->
  <g>
    <rect x="230" y="482" width="220" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="500" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Validated answer</text>
    <text x="340" y="520" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Delivered to user</text>
  </g>

  <!-- Step labels on left -->
  <text x="18" y="42" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 1</text>
  <text x="18" y="120" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 2</text>
  <text x="18" y="198" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 3</text>
  <text x="18" y="284" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 4</text>
  <text x="18" y="430" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 5</text>
  <text x="18" y="510" text-anchor="start" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Step 6</text>
</svg>
